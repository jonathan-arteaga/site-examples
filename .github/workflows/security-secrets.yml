name: Security Secrets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned, checksum-verified Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.24.3 --repo gitleaks/gitleaks \
            --pattern gitleaks_8.24.3_linux_x64.tar.gz \
            --pattern gitleaks_8.24.3_checksums.txt \
            --dir "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          sha256sum --check --ignore-missing gitleaks_8.24.3_checksums.txt
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
      - name: Scan complete imported history
        run: >-
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact
          --log-opts="--all --full-history"
          --report-format=sarif --report-path="$RUNNER_TEMP/gitleaks.sarif"
